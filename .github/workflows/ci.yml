name: RaceDay CI Pipeline

on:
  push:
    branches: [ "main", "part3" ]
  pull_request:
    branches: [ "main", "part3" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Automatically Find Solution and Test Files
      run: |
        SLN_PATH=$(find . -name "*.sln" | head -n 1)
        echo "SLN_PATH=$SLN_PATH" >> $GITHUB_ENV
        echo "Found solution at: $SLN_PATH"

        TEST_PATH=$(find . -name "*Tests.csproj" | head -n 1)
        echo "TEST_PATH=$TEST_PATH" >> $GITHUB_ENV
        echo "Found tests at: $TEST_PATH"

    - name: Restore dependencies
      run: dotnet restore "$SLN_PATH"

    - name: Build Solution
      run: dotnet build "$SLN_PATH" --no-restore -c Release

    - name: Run Automated Tests
      run: |
        if [ -n "$TEST_PATH" ]; then
          dotnet test "$TEST_PATH" --no-build --verbosity normal -c Release
        else
          echo "No test project found, skipping."
        fi
